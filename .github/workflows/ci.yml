name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    name: Tipos, API e navegador
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Build (site público + painel + servidor)
        run: npm run build

      - name: Testes da API (painel protegido, quadro, subtarefas, documentos, e-mail, relatório, acessos)
        run: npm test

      - name: Navegador para os testes de ponta a ponta
        run: npx playwright install --with-deps chromium

      - name: Testes de ponta a ponta (site público e painel)
        run: npx playwright test -c e2e

      - name: Guardar evidências se algo falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-falhas
          path: test-results/
          retention-days: 7
